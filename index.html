@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap');
:root{--bg:#f7f8f5;--paper:#fff;--ink:#152d29;--muted:#708078;--forest:#174d3c;--forest2:#26634e;--gold:#b78c46;--line:#e4ebe5;--soft:#eff5ef;--rose:#b15d50;--blue:#426e8a;--shadow:0 7px 35px rgba(17,46,36,.045)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{display:flex;min-height:100vh}.sidebar{width:244px;position:fixed;inset:0 auto 0 0;background:#12372f;color:white;padding:26px 16px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:12px;padding:6px 12px 22px;border-bottom:1px solid #ffffff22}.brandmark{width:36px;height:36px;border-radius:10px;background:#d1b57b;color:#12372f;display:grid;place-items:center;font-size:22px;font-weight:700}.brand b{display:block;font-size:16px;letter-spacing:-.7px}.brand small{font-size:10px;letter-spacing:2px;color:#c7d5ce}.workspace{padding:19px 11px 14px;color:#a5c0b6;font-size:10px;letter-spacing:1.5px;font-weight:800}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;color:#c5d5cd;border-radius:9px;display:flex;align-items:center;gap:13px;font-weight:600;font-size:13px}.nav button:hover{background:#ffffff12;color:white}.nav button.active{background:#ffffff22;color:#fff}.glyph{font-size:17px;width:21px;text-align:center;opacity:.95}.sidebar-bottom{margin-top:auto;padding:13px 12px 4px;border-top:1px solid #ffffff22;font-size:12px;color:#b8cfc2}.sidebar-bottom strong{display:block;color:#fff;margin-bottom:6px}.main{margin-left:244px;min-width:0;width:calc(100% - 244px)}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 36px;gap:16px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--ink);font-weight:700}.topright{display:flex;align-items:center;gap:14px}.avatar{width:34px;height:34px;border-radius:50%;background:#e4eadf;display:grid;place-items:center;font-weight:800;color:var(--forest)}.select,.btn,.input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;color:var(--ink);outline:none}.select{max-width:225px;min-width:140px}.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;font-weight:700;white-space:nowrap}.btn:hover{border-color:#9cbcac}.btn.primary{background:var(--forest);color:white;border-color:var(--forest)}.btn.primary:hover{background:#226147}.btn.ghost{background:var(--soft)}.content{max-width:1550px;margin:auto;padding:32px 38px 55px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--forest2);font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;margin-bottom:6px}h1{font-size:29px;letter-spacing:-1.25px;margin:0 0 6px;font-weight:800}h2{font-size:18px;letter-spacing:-.6px;margin:0}h3{font-size:14px;margin:0}p{color:var(--muted);line-height:1.55;margin:5px 0}.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.demo{background:#f2f6e9;border:1px solid #dce8c8;color:#687e3a;padding:9px 13px;border-radius:8px;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:21px 20px;min-height:135px}.stat .label{color:var(--muted);font-size:12px;font-weight:600}.stat .value{font-size:31px;font-weight:800;letter-spacing:-1.1px;margin:12px 0 8px}.stat .trend{color:var(--forest2);font-size:11px;font-weight:800}.panel{padding:23px;margin-bottom:17px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:21px}.panel-head small{color:var(--muted)}.grid-2{display:grid;grid-template-columns:1.65fr 1fr;gap:17px}.grid-even{display:grid;grid-template-columns:1fr 1fr;gap:17px}.chart svg{width:100%;height:235px;overflow:visible}.chart .gridline{stroke:#e6ede7;stroke-width:1}.chart text{font:11px 'DM Sans',sans-serif;fill:#7e8b83}.chart .line{stroke:#2c7c61;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:#5fa283;fill-opacity:.13}.barrow{display:flex;align-items:center;gap:15px;margin:18px 0}.barlabel{width:135px;font-size:12px;font-weight:650}.bartrack{flex:1;background:#f0f4ef;height:9px;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#3b8b6d;border-radius:20px}.barvalue{width:42px;text-align:right;font-weight:750;font-size:12px}.tag{display:inline-flex;align-items:center;background:#edf5ee;color:#2f7253;font-size:11px;font-weight:750;border-radius:6px;padding:6px 8px}.tag.gold{color:#90682c;background:#faf1df}.tag.red{color:#a25246;background:#fbece8}.tag.blue{color:#4d7095;background:#eef3f8}.note{font-size:11px;color:var(--muted);line-height:1.5}.divider{border-bottom:1px solid var(--line);margin:14px 0}.attention{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.attention:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none}.attention strong{display:block;font-size:12px}.attention small{color:var(--muted);font-size:11px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#89968d;font-weight:800;border-bottom:1px solid var(--line);padding:13px 13px}td{padding:15px 13px;border-bottom:1px solid #f0f2ef;font-size:12px}tr:last-child td{border-bottom:none}.tlink{font-weight:800;color:var(--forest);cursor:pointer}.muted{color:var(--muted)}.lead{font-size:13px}.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.filters input{min-width:240px}.pill-nav{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:700}.pill.active{background:var(--forest);color:#fff}.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.fstep{padding:19px 12px;background:#f4f8f4;border-radius:11px;text-align:center;border-bottom:3px solid #2d785b}.fstep strong{font-size:23px;display:block}.fstep small{font-size:10px;color:var(--muted)}.substat{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.substat .stat{min-height:106px}.substat .value{font-size:24px}.task{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}.task:last-child{border:0}.task input{accent-color:var(--forest);width:17px;height:17px}.task strong{display:block;font-size:13px}.task small{color:var(--muted);display:block;margin-top:4px}.task .tag{margin-left:auto}.modal-back{position:fixed;inset:0;background:#0a1b16a8;z-index:30;display:grid;place-items:center;padding:20px}.modal{background:#fff;width:min(510px,100%);padding:28px;border-radius:16px;box-shadow:0 18px 100px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:750}.field.full{grid-column:1/-1}.field input,.field select{width:100%;min-width:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:24px;right:24px;background:#153f32;color:white;padding:14px 20px;border-radius:10px;z-index:100;box-shadow:0 9px 30px #0002}.menu-toggle{display:none}.shade{display:none}.empty{padding:36px;text-align:center;color:var(--muted);background:#fafcf9;border-radius:10px} .threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.roles td,.roles th{white-space:normal}.section-spacer{height:7px}@media(max-width:1200px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}.content{padding:26px}.topbar{padding:0 26px}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.shade.open{display:block;position:fixed;inset:0;background:#0008;z-index:9}.main{margin-left:0;width:100%}.menu-toggle{display:inline-flex}.topbar{padding:0 16px;height:65px}.topright{gap:7px}.topright .avatar{display:none}.select{max-width:150px;min-width:0;font-size:11px}.content{padding:22px 16px}.page-head{flex-direction:column}.grid-even,.threecol{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:15px;min-height:118px}.stat .value{font-size:25px}.funnel{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:17px}}
</style></head><body><div id="app"></div><script>
const routes=[['dashboard','◫','Overview'],['attendance','▥','Attendance'],['outreach','◎','Outreach Analytics'],['people','♙','People & Visitors'],['follow-ups','☷','Follow-ups'],['reports','▤','Reports'],['settings','⚙','Settings']];
const seeds={riverside:{name:'Riverside Community Church',short:'Riverside',scale:1,attendance:[310,323,335,326,354,345,372,366,389,401,395,418,426],campaigns:[['Community Food Drive','Community',520,72,27,46,31,850],['University Connect','Campus',410,63,22,39,28,540],['Neighbourhood Visits','Door-to-door',260,29,11,20,14,300],['Youth Sports Day','Youth',490,79,31,57,40,710],['Social Media Invitation','Digital',1400,48,14,26,16,220]]},grace:{name:'Grace Fellowship',short:'Grace',scale:.64,attendance:[188,194,205,199,217,224,229,218,240,250,244,268,271],campaigns:[['Family Fun Weekend','Community',320,46,17,30,22,410],['Student Welcome','Campus',280,39,12,24,17,300],['Home Visits','Door-to-door',180,20,7,16,10,180],['Community Soccer','Youth',360,55,19,39,27,500],['Online Invitations','Digital',900,30,9,17,11,120]]}};
const state={church:'riverside',page:'dashboard',range:'90d',q:'',status:'All',channel:'All',sort:'first',modal:null,detail:null,sidebar:false,added:{riverside:[],grace:[]},tasks:{riverside:[['Call first-time visitors from Sunday','Pastoral care','Today',false],['Check in with Community Food Drive visitors','Outreach team','Overdue',false],['Arrange newcomer welcome lunch','Admin team','Tomorrow',false],['Update youth event follow-up notes','Youth team','Completed',true]],grace:[['Review new visitor cards','Welcome team','Today',false],['Schedule student follow-up','Youth team','Overdue',false],['Update community outreach report','Outreach team','Completed',true]]},entries:{riverside:[],grace:[]}};
function data(){return seeds[state.church]}function fmt(n){return Math.round(n).toLocaleString('en-US')}function pct(a,b){return b?Math.round(a/b*100):0}function camps(){return [...data().campaigns,...state.added[state.church]]}function kpis(){let c=camps(),m=state.range==='30d'?0.35:state.range==='12m'?3:1;return {avg:Math.round(data().attendance.slice(-4).reduce((a,b)=>a+b,0)/4)+state.entries[state.church].reduce((a,x)=>a+x.total,0),first:Math.round(c.reduce((s,x)=>s+x[3],0)*m),believers:Math.round(c.reduce((s,x)=>s+x[4],0)*m),ret:pct(c.reduce((s,x)=>s+x[6],0),c.reduce((s,x)=>s+x[3],0))}};
function el(tag,attrs={},txt=''){let o=document.createElement(tag);Object.assign(o,attrs);if(txt)o.textContent=txt;return o}function money(n){return '$'+fmt(n)}function notice(t){let n=el('div',{className:'toast'},t);document.body.append(n);setTimeout(()=>n.remove(),2900)}function go(p){state.page=p;state.q='';state.status='All';state.sidebar=false;history.replaceState({},'', '#/'+p);render();window.scrollTo(0,0)}function button(t,fn,cls=''){let b=el('button',{className:'btn '+cls},t);b.onclick=fn;return b}function card(title,inner,right=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2><small>${right}</small></div>${inner}</section>`}function toolbar(){return `<div class="controls"><select class="select" id="range"><option value="30d">Last 30 days</option><option value="90d">Last 90 days</option><option value="12m">Last 12 months</option></select><button class="btn" id="export">↓ Export demo CSV</button></div>`}function header(k,title,sub,buttons=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div>${buttons}</div>`}function stats(arr){return `<div class="stats">${arr.map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="trend">${x[2]}</div></div>`).join('')}</div>`}function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function lineChart(vals){let W=700,H=226,left=36,right=10,top=18,bottom=32,min=Math.floor(Math.min(...vals)*.8/50)*50,max=Math.ceil(Math.max(...vals)*1.08/50)*50;let x=i=>left+i*(W-left-right)/(vals.length-1),y=v=>top+(max-v)/(max-min)*(H-top-bottom),pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),area=`${left},${H-bottom} ${pts} ${x(vals.length-1)},${H-bottom}`;return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly attendance line chart">${[0,.25,.5,.75,1].map(t=>{let v=min+(max-min)*(1-t),yy=y(v);return `<line class="gridline" x1="36" y1="${yy}" x2="690" y2="${yy}"/><text x="2" y="${yy+4}">${fmt(v)}</text>`}).join('')}<polygon class="area" points="${area}"/><polyline class="line" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#2c7c61" stroke="white" stroke-width="2"><title>Week ${i+1}: ${fmt(v)}</title></circle>`).join('')}${vals.map((_,i)=>i%2===0||i===vals.length-1?`<text x="${x(i)}" y="${H-7}" text-anchor="middle">W${i+1}</text>`:'').join('')}</svg></div>`}
function bars(rows,maxv){return rows.map(x=>`<div class="barrow"><span class="barlabel">${x[0]}</span><div class="bartrack"><div class="barfill" style="width:${100*x[1]/maxv}%"></div></div><span class="barvalue">${fmt(x[1])}</span></div>`).join('')}
function dashboard(){let k=kpis(),c=camps(),att=data().attendance;return header('Your church at a glance','Good afternoon, welcome back.','Here’s what’s happening across your church.',toolbar())+stats([['Average weekly attendance',fmt(k.avg),'Recent four weeks'],['First-time visitors',fmt(k.first),'Outreach-attributed estimate'],['New believer commitments',fmt(k.believers),'Self-reported · demo'],['90-day visitor return',k.ret+'%','Illustrative mature cohorts']])+`<div class="grid-2">${card('Attendance over time',lineChart(att), 'Weekly service attendance')}${card('Where visitors come from',bars(c.map(x=>[x[0],x[3]]),Math.max(...c.map(x=>x[3])))+'<p class="note">Demo counts are attributed to outreach sources; they do not represent every visitor.</p>')}</div><div class="grid-even">${card('Outreach effectiveness',table(['Campaign','First visits','90-day return'],c.map((x,i)=>`<tr><td><a href="#/outreach" class="tlink" data-campaign="${i}">${x[0]}</a></td><td>${x[3]}</td><td><span class="tag">${pct(x[6],x[3])}%</span></td></tr>`)),'Select a campaign to explore')}${card('Needs your attention',`<div class="attention"><span class="dot"></span><div><strong>Follow-up tasks are due</strong><small>${state.tasks[state.church].filter(x=>!x[3]).length} open tasks · review your follow-up queue</small></div></div><div class="attention"><span class="dot"></span><div><strong>Investigate digital outreach engagement</strong><small>Digital channels have lower 90-day return in this fictional sample</small></div></div><div class="attention"><span class="dot"></span><div><strong>Review high-performing youth outreach</strong><small>Higher observed return rate; validate cohorts before changing resources</small></div></div>`,'Rule-based demo observations')}</div>`}
function attendance(){let vals=data().attendance.concat(state.entries[state.church].map(x=>x.total)),k=kpis();return header('Services & participation','Attendance','Monitor services, first visits and return attendance.',`<div class="controls"><button class="btn primary" id="add-att">＋ Record attendance</button></div>`)+stats([['Average attendance',fmt(k.avg),'Four most recent weeks'],['Highest weekly attendance',fmt(Math.max(...vals)),'Recorded demo series'],['Services tracked',fmt(vals.length),'Weekly records'],['Last recorded',fmt(vals.at(-1)),'Most recent service']])+card('Weekly attendance',lineChart(vals),'Illustrative attendance records')+card('Service register',table(['Period','Total attendance','Record type'],vals.slice().reverse().map((n,i)=>`<tr><td>Week ${vals.length-i}</td><td><strong>${fmt(n)}</strong></td><td><span class="tag ${i<state.entries[state.church].length?'gold':''}">${i<state.entries[state.church].length?'Added in this session':'Demo fixture'}</span></td></tr>`)),'Recent weeks first')+`<p class="note">The attendance register is illustrative. Added records remain only in this browser session.</p>`}
function outreach(){let list=camps().map((x,i)=>({x,i})).filter(({x})=>(state.channel==='All'||x[1]===state.channel)&&x[0].toLowerCase().includes(state.q.toLowerCase()));list.sort((a,b)=>state.sort==='return'?pct(b.x[6],b.x[3])-pct(a.x[6],a.x[3]):state.sort==='name'?a.x[0].localeCompare(b.x[0]):b.x[3]-a.x[3]);let c=camps();return header('Mission impact','Outreach Analytics','Understand where first visits originate—and what happens afterwards.',`<div class="controls"><button class="btn primary" id="add-out">＋ New outreach</button></div>`)+stats([['Outreach campaigns',c.length,'Recorded in demo'],['People reached',fmt(c.reduce((a,x)=>a+x[2],0)),'Not unique individuals'],['Attributed first visits',fmt(c.reduce((a,x)=>a+x[3],0)),'Source linked'],['Observed 90-day return',pct(c.reduce((a,x)=>a+x[6],0),c.reduce((a,x)=>a+x[3],0))+'%','Illustrative mature cohorts']])+`<div class="grid-2">${card('First visits by outreach',bars(c.map(x=>[x[0],x[3]]),Math.max(...c.map(x=>x[3]))),'Attributed first visits')}${card('The journey from outreach',`<div class="funnel"><div class="fstep"><strong>${fmt(c.reduce((s,x)=>s+x[2],0))}</strong><small>People reached</small></div><div class="fstep"><strong>${fmt(c.reduce((s,x)=>s+x[3],0))}</strong><small>First visits</small></div><div class="fstep"><strong>${fmt(c.reduce((s,x)=>s+x[4],0))}</strong><small>Commitments</small></div><div class="fstep"><strong>${fmt(c.reduce((s,x)=>s+x[6],0))}</strong><small>90-day return</small></div></div><p class="note" style="margin-top:17px">These are distinct measures. Self-reported commitments and return attendance are not assumed to be a single linear conversion funnel.</p>`,'Illustrative observations')}</div><section class="panel"><div class="panel-head"><h2>Compare campaigns</h2><small>Click a campaign for details</small></div><div class="filters"><input class="input" placeholder="Search campaigns..." id="q" value="${state.q}"/><select class="select" id="channel"><option>All</option>${[...new Set(c.map(x=>x[1]))].map(x=>`<option ${state.channel===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="sort"><option value="first" ${state.sort==='first'?'selected':''}>Most first visits</option><option value="return" ${state.sort==='return'?'selected':''}>Highest return rate</option><option value="name" ${state.sort==='name'?'selected':''}>Campaign name</option></select></div>${table(['Campaign','Channel','Reached','First visits','Commitments','30-day return','90-day return','Spend'],list.map(({x,i})=>`<tr><td><a href="#/outreach" class="tlink" data-campaign="${i}">${x[0]}</a></td><td>${x[1]}</td><td>${fmt(x[2])}</td><td>${x[3]}</td><td>${x[4]}</td><td>${pct(x[5],x[3])}%</td><td><span class="tag">${pct(x[6],x[3])}%</span></td><td>${money(x[7])}</td></tr>`))}</section><p class="note">Attribution is based on reported campaign source. Return rates divide recorded returns by first visits in a sufficiently mature cohort; these demo figures do not establish causation.</p>`}
function people(){let n=Math.round(26*data().scale),rows=Array.from({length:n},(_,i)=>({id:`VIS-${state.church==='riverside'?'R':'G'}-${String(i+1).padStart(3,'0')}`,source:camps()[i%camps().length][0],status:['First visit','Returned','In follow-up','Connected'][i%4],visit:`Week ${13-(i%12)}`})).filter(x=>(state.status==='All'||x.status===state.status)&&(x.id+' '+x.source).toLowerCase().includes(state.q.toLowerCase()));return header('Visitor journeys','People & Visitors','Follow engagement journeys without losing sight of individual privacy.')+`<div class="panel" style="background:#f4f9f3"><h3>Privacy-first demo</h3><p>All identifiers below are fictitious. Religious beliefs and commitments are sensitive personal data. Real records will require consent, access controls, deletion rules and secure tenancy before launch.</p></div>`+stats([['Visitor profiles',n,'Pseudonymous demo records'],['First visits',Math.ceil(n/4),'Beginning journey'],['In follow-up',Math.floor(n/4),'Active care workflow'],['Connected',Math.floor(n/4),'Ongoing engagement']])+`<section class="panel"><div class="panel-head"><h2>Visitor journey records</h2><small>Fictional, pseudonymous data</small></div><div class="filters"><input id="q" class="input" placeholder="Search ID or source..." value="${state.q}"/><select id="status" class="select">${['All','First visit','Returned','In follow-up','Connected'].map(x=>`<option ${state.status===x?'selected':''}>${x}</option>`).join('')}</select></div>${rows.length?table(['Visitor ID','First connection','Stage','Last engagement'],rows.map(x=>`<tr><td class="tlink">${x.id}</td><td>${x.source}</td><td><span class="tag ${x.status==='First visit'?'gold':x.status==='In follow-up'?'blue':''}">${x.status}</span></td><td>${x.visit}</td></tr>`)):'<div class="empty">No demo visitors match your filters.</div>'}</section>`}
function followups(){let t=state.tasks[state.church],items=t.map((x,i)=>({x,i})).filter(({x})=>state.status==='All'||(state.status==='Open'&&!x[3])||(state.status==='Completed'&&x[3])||(state.status==='Overdue'&&x[2]==='Overdue'&&!x[3]));return header('Pastoral care','Follow-ups','Coordinate next steps for visitors and outreach connections.',`<button class="btn primary" id="add-task">＋ Add follow-up</button>`)+stats([['All tasks',t.length,'This church'],['Open tasks',t.filter(x=>!x[3]).length,'Requires attention'],['Overdue',t.filter(x=>!x[3]&&x[2]==='Overdue').length,'Past due'],['Completed',t.filter(x=>x[3]).length,'This session']])+`<section class="panel"><div class="panel-head"><h2>Follow-up queue</h2><small>Changes are local demo state</small></div><div class="filters"><div class="pill-nav">${['All','Open','Overdue','Completed'].map(x=>`<button class="pill ${state.status===x?'active':''}" data-status="${x}">${x}</button>`).join('')}</div></div>${items.length?items.map(({x,i})=>`<div class="task"><input type="checkbox" data-task="${i}" ${x[3]?'checked':''} aria-label="Mark ${x[0]} complete"/><div style="flex:1"><strong style="${x[3]?'text-decoration:line-through;color:#83918a':''}">${x[0]}</strong><small>${x[1]} · ${x[2]}</small></div><span class="tag ${x[3]?'':x[2]==='Overdue'?'red':'gold'}">${x[3]?'Done':x[2]}</span></div>`).join(''):'<div class="empty">No tasks match the current filter.</div>'}</section>`}
function reports(){let k=kpis(),c=camps();return header('Management intelligence','Reports','Clear summaries for church leadership and outreach teams.',toolbar())+`<div class="grid-even">${card('Executive summary',`<div class="eyebrow">Demo report · ${data().short}</div><h2 class="serif" style="font-size:25px;margin:13px 0">Growth and engagement overview</h2><p class="lead">Recent average attendance is <strong>${fmt(k.avg)}</strong>. The selected sample records show <strong>${fmt(k.first)}</strong> attributed first visits and <strong>${fmt(k.believers)}</strong> self-reported commitments. Observed 90-day return stands at <strong>${k.ret}%</strong> in the illustrative mature cohort.</p><div class="divider"></div><p>Interpretation: Youth and community outreach show stronger observed return rates in the example. Check cohort maturity, audience composition and data quality before reprioritising resources.</p><p class="note">This is a template-generated summary, not AI-generated analysis or real pastoral advice.</p>`,'Illustrative')}${card('Available reports',`<div class="attention"><span class="dot"></span><div><strong>Attendance Trends</strong><small>Weekly activity and service participation</small></div></div><div class="attention"><span class="dot"></span><div><strong>Outreach Performance</strong><small>Sources, first visits and observed return</small></div></div><div class="attention"><span class="dot"></span><div><strong>Visitor Journey</strong><small>Stages and follow-up workload</small></div></div><button class="btn primary" id="export-report" style="margin-top:15px">↓ Export summary CSV</button>`,'CSV sample')}</div>${card('Metric definitions',table(['Metric','Definition'],[['Average weekly attendance','Average total attendees for last four recorded service weeks'],['Attributed first visits','Visitors who identified a recorded outreach source'],['Self-reported commitments','Faith commitments recorded voluntarily (illustrative demo)'],['90-day return rate','First visitors who returned within 90 days, divided by eligible first-visit cohort']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td style="white-space:normal">${x[1]}</td></tr>`)),'Definitions before decisions')}`}
function settings(){return header('Workspace administration','Church Settings','A preview of how independent churches will manage their workspace.')+`<div class="grid-even">${card('Church profile',`<div class="field"><label>Church name</label><input class="input" value="${data().name}" disabled/></div><div class="divider"></div><div class="field"><label>Workspace</label><input class="input" value="${state.church}" disabled/></div><p class="note" style="margin-top:15px">Demo church identities only. Workspace configuration will be editable after the real backend is built.</p>`,'Demo profile')}${card('Account readiness',`<div class="attention"><span class="dot"></span><div><strong>Secure church sign-in</strong><small>Planned: identity and authentication</small></div></div><div class="attention"><span class="dot"></span><div><strong>Subscription and billing</strong><small>Planned: plans, receipts and payment handling</small></div></div><div class="attention"><span class="dot"></span><div><strong>Data privacy and isolation</strong><small>Planned: server-enforced permissions and tenant boundaries</small></div></div>`,'Not yet implemented')}</div>${card('Proposed church roles',table(['Role','Attendance','Outreach','Follow-ups','Manage workspace'],[['Church Admin','Full','Full','Full','Yes'],['Outreach Lead','View','Edit','Manage own','No'],['Attendance Clerk','Edit','View','View limited','No'],['Care Coordinator','View','View','Manage assigned','No']].map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`)),'Illustrative permissions — not enforced in this prototype')}`}
function csv(name,rows){let text=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=el('a',{href:URL.createObjectURL(new Blob([text],{type:'text/csv'})),download:name});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),300);notice('Sample CSV exported')}function exportData(){let c=camps();csv(`outreach-demo-${state.church}.csv`,[['Campaign','Channel','People reached','Attributed first visits','Commitments','30d returned','90d returned','Demo spend'],...c])}
function modal(title,fields,submit){let cover=el('div',{className:'modal-back'}),box=el('div',{className:'modal'});box.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn" id="close">✕</button></div><form id="mform"><div class="form-grid">${fields.map(f=>`<label class="field ${f.full?'full':''}">${f.label}<input class="input" name="${f.key}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" ${f.min!==undefined?`min="${f.min}"`:''} required/></label>`).join('')}</div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">Save demo record</button></div></form>`;cover.append(box);document.body.append(cover);let close=()=>cover.remove();box.querySelector('#close').onclick=close;box.querySelector('#cancel').onclick=close;cover.onclick=e=>{if(e.target===cover)close()};box.querySelector('#mform').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(submit(v)!==false){close();render();notice('Saved in this browser session (demo only)')}}}
function setup(){let app=document.getElementById('app'),d=data();app.innerHTML=`<div class="shade ${state.sidebar?'open':''}" id="shade"></div><div class="app"><aside class="sidebar ${state.sidebar?'open':''}"><div class="brand"><div class="brandmark">✦</div><div><b>Church Growth</b><small>INTELLIGENCE</small></div></div><div class="workspace">YOUR WORKSPACE</div><nav class="nav">${routes.map(x=>`<button class="${state.page===x[0]?'active':''}" data-nav="${x[0]}"><span class="glyph">${x[1]}</span>${x[2]}</button>`).join('')}</nav><div class="sidebar-bottom"><strong>Thoughtful growth. Better insight.</strong>Frontend concept · No real records are stored.</div></aside><main class="main"><div class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="btn menu-toggle" id="mobile-menu">☰</button><span class="crumb">Workspace <span style="padding:0 8px;color:#bdc8bf">/</span> <strong>${routes.find(x=>x[0]===state.page)?.[2]}</strong></span></div><div class="topright"><span class="demo">● DEMO MODE</span><select class="select" id="church"><option value="riverside">Riverside Community Church</option><option value="grace">Grace Fellowship</option></select><div class="avatar">${d.short[0]}</div></div></div><div class="content" id="page"></div></main></div>`;app.querySelector('#church').value=state.church;app.querySelector('#church').onchange=e=>{state.church=e.target.value;state.q='';state.status='All';render()};app.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>go(n.dataset.nav));app.querySelector('#mobile-menu').onclick=()=>{state.sidebar=!state.sidebar;setup()};app.querySelector('#shade').onclick=()=>{state.sidebar=false;setup()};let views={dashboard,attendance,outreach,people,'follow-ups':followups,reports,settings};app.querySelector('#page').innerHTML=views[state.page]();let range=app.querySelector('#range');if(range){range.value=state.range;range.onchange=e=>{state.range=e.target.value;render()}}let ex=app.querySelector('#export');if(ex)ex.onclick=exportData;app.querySelectorAll('[data-campaign]').forEach(x=>x.onclick=e=>{e.preventDefault();let c=camps()[+x.dataset.campaign];modal('Campaign details — '+c[0],[{label:'Campaign',key:'c',placeholder:c[0],full:true}],()=>false);document.querySelector('.modal .form-grid').innerHTML=`<div class="funnel" style="grid-column:1/-1"><div class="fstep"><strong>${c[2]}</strong><small>People reached</small></div><div class="fstep"><strong>${c[3]}</strong><small>First visits</small></div><div class="fstep"><strong>${c[4]}</strong><small>Commitments</small></div><div class="fstep"><strong>${c[6]}</strong><small>90d returns</small></div></div><div style="grid-column:1/-1"><p>Source: <b>${c[1]}</b> · Recorded spending: <b>${money(c[7])}</b></p><p>Observed 90-day return: <b>${pct(c[6],c[3])}%</b> of source-attributed first visits. Review comparable cohorts before adjusting programme investment.</p></div>`;document.querySelector('#mform button[type=submit]').style.display='none'});let q=app.querySelector('#q');if(q)q.oninput=e=>{let pos=e.target.selectionStart;state.q=e.target.value;setup();let input=document.querySelector('#q');input?.focus();input?.setSelectionRange(pos,pos)};let channel=app.querySelector('#channel');if(channel)channel.onchange=e=>{state.channel=e.target.value;setup()};let sort=app.querySelector('#sort');if(sort)sort.onchange=e=>{state.sort=e.target.value;setup()};let status=app.querySelector('#status');if(status)status.onchange=e=>{state.status=e.target.value;setup()};app.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{state.status=x.dataset.status;setup()});app.querySelectorAll('[data-task]').forEach(x=>x.onchange=e=>{state.tasks[state.church][+x.dataset.task][3]=e.target.checked;setup();notice('Follow-up updated (demo)')});let addA=app.querySelector('#add-att');if(addA)addA.onclick=()=>modal('Record service attendance',[{key:'service',label:'Service name',placeholder:'Sunday service',full:true},{key:'date',label:'Service date',type:'date'},{key:'total',label:'Total attendance',type:'number',min:0}],v=>{let n=Number(v.total);if(!Number.isFinite(n)||n<0)return false;state.entries[state.church].push({total:n,date:v.date,name:v.service})});let addO=app.querySelector('#add-out');if(addO)addO.onclick=()=>modal('Create outreach campaign',[{key:'title',label:'Campaign name',placeholder:'Community gathering',full:true},{key:'channel',label:'Outreach channel',placeholder:'Community'},{key:'reached',label:'People reached',type:'number',min:0}],v=>{state.added[state.church].push([v.title,v.channel,Number(v.reached),0,0,0,0,0])});let addT=app.querySelector('#add-task');if(addT)addT.onclick=()=>modal('New follow-up task',[{key:'task',label:'Task description',placeholder:'Call new visitors',full:true},{key:'person',label:'Assigned team',placeholder:'Welcome team'}],v=>{state.tasks[state.church].unshift([v.task,v.person,'Today',false])});let rep=app.querySelector('#export-report');if(rep)rep.onclick=()=>{let k=kpis();csv(`executive-summary-demo-${state.church}.csv`,[['Metric','Value'],['Average attendance',k.avg],['Attributed first visits',k.first],['Commitments',k.believers],['90d visitor return',k.ret+'%']])};}
function render(){setup()}window.addEventListener('hashchange',()=>{let page=location.hash.split('/')[1];if(routes.some(x=>x[0]===page)&&state.page!==page)go(page)});let initial=location.hash.split('/')[1];if(routes.some(x=>x[0]===initial))state.page=initial;render();
</script></body></html>
